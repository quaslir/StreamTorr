name: C++ Hardcore CI
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++-13
          - clang++-18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++-13 \
            clang-18 \
            ccache \
            build-essential \
            pkg-config \
            perl \
            nasm \
            yasm \
            libssl-dev \
            libboost-all-dev

      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get install -y \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev

      - name: Show environment
        run: |
          cmake --version
          ${{ matrix.compiler }} --version
          nasm --version
          echo "Boost check:"
          ls -d /usr/include/boost


      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}


      - name: Cache FFmpeg static build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg_ext
          key: ffmpeg-static-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.compiler }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-${{ github.ref }}-
            ccache-${{ matrix.compiler }}-

      - name: Configure
        env:
          Boost_NO_BOOST_CMAKE: ON
          CCACHE_DIR: /home/runner/.ccache
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_INCLUDE_DIR=/usr/include \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          cmake --build build --parallel

      - name: Test
        working-directory: build
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ctest --output-on-failure

      - name: ccache stats
        run: ccache -s
